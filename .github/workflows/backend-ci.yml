name: Backend CI

on:
  push:
    branches: [ main ]
    paths:
      - 'ElderCareServer/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'ElderCareServer/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ElderCareServer

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # The wrapper jar is a binary that executes on every build, so its
      # checksum is compared against the list Gradle publishes before it runs.
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run the full suite
        run: ./gradlew test --no-daemon

      - name: Publish the test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ElderCareServer/build/reports/tests/test
            ElderCareServer/build/test-results/test

      - name: Publish the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ElderCareServer/build/reports/jacoco/test

  build-image:
    name: Build the container image
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Build the image
        run: docker build -f ElderCareServer/dockerfile -t eldercare-server:${{ github.sha }} ElderCareServer
