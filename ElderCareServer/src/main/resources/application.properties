spring.application.name=ElderCareServer

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/eldercare}
spring.datasource.username=${DATABASE_USER:eldercare}
spring.datasource.password=${DATABASE_PASSWORD:eldercare}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false

# Override this in every deployed environment. The default below exists only so
# the application starts in local development. It is not a production secret and
# the application refuses to start if the decoded key is shorter than 32 bytes.
eldercare.jwt.secret=${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWtleS1ub3QtZm9yLXByb2R1Y3Rpb24tdXNlLTEyMzQ1}
eldercare.jwt.validity-seconds=${JWT_VALIDITY_SECONDS:43200}

# Origins allowed to call the API, comma separated. Defaults to the Vite dev
# server so a local frontend works without extra configuration.
eldercare.allowed-origin=${ALLOWED_ORIGIN:http://localhost:5173}

# Render polls a health endpoint to decide whether a deploy succeeded, and
# assigns the port through the PORT variable.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
server.port=${PORT:8080}
