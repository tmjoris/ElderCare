# Render blueprint for the application.
#
# The database is not declared here. It lives on Neon, because Render deletes a
# free PostgreSQL instance thirty days after it is created and this needs to stay
# reachable. DATABASE_URL is set on the service to Neon's connection string, and
# the application converts that postgres:// URI into the JDBC form the driver
# expects.
#
# See the root README for what each variable does.

services:
  - type: web
    name: eldercare-backend
    runtime: docker
    plan: free
    rootDir: ElderCareServer
    dockerfilePath: ./Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Set manually to the Neon connection string, not linked to a Render
      # database, so it is deliberately marked sync: false rather than given a
      # value that would end up in version control.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JPA_DDL_AUTO
        value: update
      - key: ALLOWED_ORIGIN
        value: https://eldercarekali.onrender.com

  - type: web
    name: eldercare-frontend
    runtime: static
    rootDir: ElderCareClient
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # Vite reads this at build time, not at run time. Changing it requires a
      # redeploy, not just a restart. The name must start with VITE_ or Vite
      # will not expose it to the bundle.
      - key: VITE_API_URL
        fromService:
          name: eldercare-backend
          type: web
          property: host
    routes:
      # A single page application serves every path from index.html. Without
      # this, opening https://.../login directly returns 404, because no file
      # exists at that path. The status must be a rewrite rather than a
      # redirect, so the browser keeps the URL it asked for.
      - type: rewrite
        source: /*
        destination: /index.html
